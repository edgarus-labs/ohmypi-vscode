name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish a GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Package the extension (.vsix)
        run: npm run package
      - name: Verify the VSIX version and file name against the tag
        run: node scripts/vsix.mjs verify "$GITHUB_REF_NAME"
      - name: Name the VSIX
        id: vsix
        run: echo "name=$(node scripts/vsix.mjs name)" >> "$GITHUB_OUTPUT"
      - name: Upload the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.name }}
          path: dist-vsix/${{ steps.vsix.outputs.name }}
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-vsix/${{ steps.vsix.outputs.name }}
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
